<div class="dashboard-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Gestión Logística</h2>
    </div>

    <nav class="sidebar-nav">
      <p class="nav-label">MÓDULOS</p>

      <!-- Clientes -->
      <a (click)="vistaActiva = 'clientes'"
         [class.active]="vistaActiva === 'clientes'"
         class="nav-item"
         style="cursor: pointer;">
        <span class="nav-icon">👥</span>
        <span>Clientes</span>
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ nombreUsuario.charAt(0) }}</div>
        <div>
          <p class="user-name">{{ nombreUsuario }}</p>
          <p class="user-role">{{ rolUsuario }}</p>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <div class="dashboard-welcome">
      <h1>Bienvenido al Dashboard</h1>
    </div>

    <div class="contenido">

      @if (vistaActiva === 'clientes') {
        <app-clientes></app-clientes>
      }
      
    </div>


  </main>

</div>
